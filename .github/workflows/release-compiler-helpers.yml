name: Release compiler helpers
# Builds @tsoa/compiler-helper-tsgo and @tsoa/compiler-helper-tsrs with their platform packages, runs tsoa's suite on
# every binary on its own platform, and keeps the tarballs as artifacts. Publishes to npm only when `publish` is true.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packed tarballs to npm
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  go:
    name: Build the Go helper for every platform and pack both umbrella packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Cross-compile and pack
        shell: bash
        run: |
          set -e
          platforms=""
          for target in linux/amd64/linux-x64 linux/arm64/linux-arm64 darwin/amd64/darwin-x64 darwin/arm64/darwin-arm64 windows/amd64/win32-x64; do
            IFS=/ read goos goarch platform <<< "$target"
            binary=binaries/$platform/helper$([ "$goos" = windows ] && echo .exe || true)
            GOOS=$goos GOARCH=$goarch node packages/cli-native/build.mjs go "$binary"
            platforms="$platforms $platform=$binary"
          done
          node packages/cli-native/pack.mjs tsgo helper-packages $platforms
          node packages/cli-native/pack.mjs tsrs helper-packages

      - uses: actions/upload-artifact@v7
        with:
          name: packages-go
          path: helper-packages/*.tgz

  test:
    name: Suite on the ${{ matrix.compiler }} helper, ${{ matrix.platform }}
    needs: go
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [tsgo, tsrs]
        platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64]
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-latest
          - platform: win32-x64
            runner: windows-latest
          - compiler: tsgo
            compiler-package: typescript@7.0.2
          - compiler: tsrs
            compiler-package: tsrs@0.25.0-ts7.1.0-beta
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Download the Go packages
        uses: actions/download-artifact@v8
        with:
          name: packages-go
          path: helper-packages

      # The toolchain tsrs v0.25.0 pins in its rust-toolchain.toml.
      - name: Setup Rust
        if: matrix.compiler == 'tsrs'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Build and pack the Rust helper
        if: matrix.compiler == 'tsrs'
        shell: bash
        run: |
          binary=packages/cli-native/rs/bin/helper${{ runner.os == 'Windows' && '.exe' || '' }}
          node packages/cli-native/build.mjs rs "$binary"
          node packages/cli-native/pack.mjs tsrs rs-packages "${{ matrix.platform }}=$binary"
          cp rs-packages/*-${{ matrix.platform }}-*.tgz helper-packages/

      - name: Unpack the binary from its package
        shell: bash
        run: |
          mkdir unpacked
          tar xzf helper-packages/tsoa-compiler-helper-${{ matrix.compiler }}-${{ matrix.platform }}-*.tgz -C unpacked
          echo "TSOA_COMPILER_HELPER=${{ github.workspace }}/unpacked/package/bin/helper${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install
        run: yarn install --ignore-scripts --no-lockfile

      - name: Build
        run: yarn run build

      - name: Test on the packed helper
        working-directory: tests
        run: yarn test

      - name: Generate in a project with ${{ matrix.compiler-package }} and the packed helper installed
        run: node packages/cli-native/check-installed.mjs ${{ matrix.compiler-package }} ${{ matrix.compiler }} helper-packages

      - name: Keep the Rust platform package
        if: matrix.compiler == 'tsrs'
        uses: actions/upload-artifact@v7
        with:
          name: packages-tsrs-${{ matrix.platform }}
          path: rs-packages/*-${{ matrix.platform }}-*.tgz

  publish:
    name: Publish to npm
    needs: test
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: helper-packages
          merge-multiple: true

      # Platform packages first, so an umbrella is never on npm before the binaries it lists.
      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for umbrella in tsgo tsrs; do
            for tarball in helper-packages/tsoa-compiler-helper-$umbrella-[a-z]*.tgz; do npm publish "$tarball" --provenance --access public; done
          done
          for umbrella in tsgo tsrs; do npm publish helper-packages/tsoa-compiler-helper-$umbrella-[0-9]*.tgz --provenance --access public; done
