on:
  push:
    branches: [master]
  pull_request: {}
name: Build and Test
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22, 24, 26]
        os: [macos-latest, ubuntu-latest, windows-latest]
        typescript-version: ['^5.0.0', '^6.0.3']
        include:
          - os: ubuntu-latest
            node-version: 24
            typescript-version: '^6.0.3'
            express-version: '^5.0.0'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Set resolutions to correct typescript version
        shell: bash
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript-version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.resolutions.typescript = process.env.TYPESCRIPT_VERSION;
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE

      # for yarn3
      # - name: Set Typescript version
      #  run: yarn set resolution typescript ${{ matrix.typescript-version }}

      - name: Install
        run: yarn install --ignore-scripts --no-lockfile

      - name: Output ts version
        run: yarn tsc --version

      - name: Output packages version
        run: yarn list

      - name: Build
        run: yarn run build

      - name: Test
        run: yarn run test

      - name: Lint
        run: yarn run lint

      - name: Install Express ${{ matrix.express-version }} for tests
        if: matrix.express-version
        shell: bash
        env:
          EXPRESS_VERSION: ${{ matrix.express-version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('tests/package.json', 'utf8'));
          packageJson.devDependencies.express = process.env.EXPRESS_VERSION;
          fs.writeFileSync('tests/package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE
          yarn install --ignore-scripts --no-lockfile

      - name: Test express suites on Express ${{ matrix.express-version }}
        if: matrix.express-version
        working-directory: tests
        run: yarn cross-env NODE_ENV=tsoa_test mocha "integration/*express*.spec.ts"

  compiler-helper:
    name: Suite on the ${{ matrix.helper }} compiler helper, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        helper: [go, rs]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # tsc/go.mod at the tsgo pin asks for go 1.27; build.mjs fails if this is older.
      - name: Setup Go
        if: matrix.helper == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      # The toolchain tsrs v0.25.0 pins in its rust-toolchain.toml.
      - name: Setup Rust
        if: matrix.helper == 'rs'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache cargo and the tsrs build
        if: matrix.helper == 'rs'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli-native/rs/tsrs/target
          key: tsrs-v0.25.0-${{ runner.os }}-${{ hashFiles('packages/cli-native/build.mjs', 'packages/cli-native/rs/tsoa_facts/**', 'packages/cli-native/rs/tsrs-patch/**') }}
          restore-keys: tsrs-v0.25.0-${{ runner.os }}-

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install
        run: yarn install --ignore-scripts --no-lockfile

      - name: Build the ${{ matrix.helper }} helper
        run: node packages/cli-native/build.mjs ${{ matrix.helper }}

      - name: Build
        run: yarn run build

      - name: Test on the ${{ matrix.helper }} helper
        working-directory: tests
        env:
          TSOA_COMPILER_HELPER: ${{ github.workspace }}/packages/cli-native/${{ matrix.helper }}/bin/helper${{ runner.os == 'Windows' && '.exe' || '' }}
        run: yarn test

      - name: Keep the Linux helper for conformance
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: helper-${{ matrix.helper }}
          path: packages/cli-native/${{ matrix.helper }}/bin/helper

  compiler-helper-conformance:
    name: Conformance, Go against Rust
    needs: compiler-helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install
        run: yarn install --ignore-scripts --no-lockfile

      - name: Build
        run: yarn run build

      - name: Download the Go helper
        uses: actions/download-artifact@v8
        with:
          name: helper-go
          path: packages/cli-native/go/bin

      - name: Download the Rust helper
        uses: actions/download-artifact@v8
        with:
          name: helper-rs
          path: packages/cli-native/rs/bin

      # Artifacts do not keep the executable bit.
      - name: Conformance, Go against Rust
        run: |
          chmod +x packages/cli-native/go/bin/helper packages/cli-native/rs/bin/helper
          node packages/cli-native/conformance/conformance.cjs packages/cli-native/go/bin/helper packages/cli-native/rs/bin/helper
