on: [push, pull_request]
name: Build and Test
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22, 24, 26]
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install
        run: yarn install --ignore-scripts --no-lockfile

      - name: Output packages version
        run: yarn list

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false

      # tsoa's metadata generator, built into the TypeScript 7 compiler (see packages/cli/native/build.mjs).
      - name: Build native generator
        run: node packages/cli/native/build.mjs

      - name: Build
        run: yarn run build

      - name: Test
        run: yarn run test

      - name: Lint
        run: yarn run lint
