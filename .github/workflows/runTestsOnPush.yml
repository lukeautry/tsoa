on: [push, pull_request]
name: Build and Test
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22, 24, 25]
        os: [macos-latest, ubuntu-latest, windows-latest]
        typescript-version: ['^5.0.0']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Set resolutions to correct typescript version
        shell: bash
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript-version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.resolutions.typescript = process.env.TYPESCRIPT_VERSION;
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE

      # for yarn3
      # - name: Set Typescript version
      #  run: yarn set resolution typescript ${{ matrix.typescript-version }}

      - name: Install
        run: yarn install --ignore-scripts --no-lockfile

      - name: Output ts version
        run: yarn tsc --version

      - name: Output packages version
        run: yarn list

      - name: Build
        run: yarn run build

      - name: Lint
        run: yarn run lint

      - name: Test
        run: yarn run test
