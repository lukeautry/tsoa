on: [push, pull_request]
name: Build and Test
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22, 24, 26]
        os: [macos-latest, ubuntu-latest, windows-latest]
        typescript-version: ['^5.7.2', '^6.0.3']

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Set resolutions to correct typescript version
        shell: bash
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript-version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.resolutions.typescript = process.env.TYPESCRIPT_VERSION;
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE

      # for yarn3
      # - name: Set Typescript version
      #  run: yarn set resolution typescript ${{ matrix.typescript-version }}

      - name: Install
        run: yarn install --ignore-scripts --no-lockfile

      - name: Output ts version
        run: yarn tsc --version

      - name: Output packages version
        run: yarn list

      - name: Build
        run: yarn run build

      - name: Test
        run: yarn run test

      - name: Lint
        run: yarn run lint

  native-compiler:
    name: Generation (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [typescript, tsrs]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: npm install -g yarn@1.22.22
      - run: yarn install --ignore-scripts --frozen-lockfile
      - run: yarn build
      - name: Generate classic reference
        run: |
          node --test tests/compiler/compiler.test.cjs
          node tests/compiler/generation.cjs "$RUNNER_TEMP/classic"
      - name: Install native compilers without replacing the build compiler
        run: npm install --prefix "$RUNNER_TEMP/native" --no-save typescript@7.0.2 tsrs@0.18.0-ts7.1.0-dev.20260929
      - name: Select native peer
        run: |
          mv node_modules/typescript node_modules/typescript-classic
          ln -s "$RUNNER_TEMP/native/node_modules/typescript" node_modules/typescript
          ln -s "$RUNNER_TEMP/native/node_modules/tsrs" node_modules/tsrs
      - name: Test native sessions and generation parity
        env:
          TSOA_COMPILER: ${{ matrix.compiler }}
        run: |
          node --test tests/compiler/compiler.test.cjs
          node tests/compiler/generation.cjs "$RUNNER_TEMP/native-output" "$RUNNER_TEMP/classic"
