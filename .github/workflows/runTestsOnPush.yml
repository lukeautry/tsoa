on: [push, pull_request]
name: Build and Test
jobs:
  build:
    name: Build${{ matrix.compiler && format(' ({0})', matrix.compiler) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22, 24, 26]
        os: [macos-latest, ubuntu-latest, windows-latest]
        typescript-version: ['^5.7.2', '^6.0.3']
        # Matching includes merge into existing combinations; a distinct Node value adds separate jobs.
        include:
          - os: ubuntu-latest
            node-version: '22.x'
            typescript-version: '^6.0.3'
            compiler: typescript@7.0.2
          - os: ubuntu-latest
            node-version: '22.x'
            typescript-version: '^6.0.3'
            compiler: typescript@7.1.0-beta
          - os: ubuntu-latest
            node-version: '22.x'
            typescript-version: '^6.0.3'
            compiler: tsrs@0.20.0-ts7.1.0-beta

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Set resolutions to correct typescript version
        shell: bash
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript-version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.resolutions.typescript = process.env.TYPESCRIPT_VERSION;
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE

      # for yarn3
      # - name: Set Typescript version
      #  run: yarn set resolution typescript ${{ matrix.typescript-version }}

      - name: Install
        run: yarn install --ignore-scripts --no-lockfile

      - name: Install generation backend
        if: matrix.compiler != ''
        shell: bash
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          npm install --prefix "$RUNNER_TEMP/native" --no-save "$COMPILER"
          echo "TSOA_COMPILER_ROOT=$RUNNER_TEMP/native" >> "$GITHUB_ENV"
          if [[ "$COMPILER" == tsrs@* ]]; then
            echo "TSOA_COMPILER=tsrs" >> "$GITHUB_ENV"
          fi

      - name: Output ts version
        run: yarn tsc --version

      - name: Output packages version
        run: yarn list

      - name: Build
        run: yarn run build

      - name: Test
        run: yarn run test

      - name: Lint
        run: yarn run lint
